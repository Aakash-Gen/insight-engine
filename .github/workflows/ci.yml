name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend — pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: researchmind-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('researchmind-backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install torch (CPU-only)
        run: |
          pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: dummy-service-key
          TAVILY_API_KEY: dummy-tavily-key
          LLM_PROVIDER: groq
          GROQ_API_KEY: dummy-groq-key
          ENVIRONMENT: test
          SENTRY_DSN: ""
          CORS_ORIGINS: "http://localhost:5173"
          ANTHROPIC_API_KEY: dummy-anthropic-key
        run: pytest -v --asyncio-mode=auto
